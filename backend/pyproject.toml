# ==============================================================================
# backend/pyproject.toml — ruff баптауы (4-сабақ)
# Орындау: cd backend && ruff check .
# ==============================================================================

[project]
name = "aidd-backend"
version = "0.1.0"
description = "AIDD Platform backend (FastAPI + Keycloak OIDC + Ollama + PostgreSQL)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes (қолданылмаған import), I — isort, UP — pyupgrade
select = ["E", "W", "F", "I", "UP"]
# UP007 (X | Y union) python 3.10+; кодта Optional пайдаланылған — қазір анықтамаймыз
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
